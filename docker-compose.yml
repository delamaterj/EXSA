services:

  frontend:
    build:
      context: ./client


  backend:
    build:
      context: ./server


  postgres:
    image: postgres:latest

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql


volumes:
  postgres-data: