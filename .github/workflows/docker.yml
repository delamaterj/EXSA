name: Docker Build

on:
  pull_request:
    branches:
      - development
      - main

  push:
    branches:
      - development
      - main


jobs:

  docker-build:

    name: Build Docker Containers

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build containers
        run: docker compose build