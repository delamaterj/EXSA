name: Docker Build

on:
  pull_request:
    branches:
      - development
      - main

  push:
    branches:
      - development
      - main


jobs:

  docker-test:

    name: Docker Compose Test

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build containers
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build


      - name: Start containers
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - name: Check container status
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

      - name: Check backend logs
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs backend


      - name: Test backend health
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi

            echo "Backend not ready, retrying..."
            sleep 2
          done

          echo "Backend failed to become healthy"
          exit 1


      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down