services:

  frontend:
    container_name: event-frontend-prod

    ports:
      - "80:5173"


  backend:
    container_name: event-backend-prod

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}


  postgres:
    container_name: event-postgres-prod