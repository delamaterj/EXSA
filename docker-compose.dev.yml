services:

  frontend:
    container_name: event-frontend-dev

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: ${VITE_API_URL}

    volumes:
      - ./client/src:/app/src


  backend:
    container_name: event-backend-dev

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}

    command:
      npm run dev

    volumes:
      - ./server/src:/app/src


  postgres:
    container_name: event-postgres-dev

    ports:
      - "5433:5432"